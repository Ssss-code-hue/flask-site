<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>IKK VPN — инструкция</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Playfair+Display&family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* Тема сайта: глубокий тёмно-синий + белый + «жидкое стекло» */
        :root {
            --bg: hsl(201 100% 13%);
            --fg: #ffffff;
            --dim: #a5a5ad;
            --line: rgba(255,255,255,.14);
            --line-soft: rgba(255,255,255,.07);
            --glass: rgba(255,255,255,.04);
            --serif: 'Instrument Serif', 'Playfair Display', Georgia, serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            padding:28px 16px 48px;
            line-height:1.55;
            -webkit-font-smoothing: antialiased;
        }
        /* отсвет северного сияния — как в живом фоне сайта */
        body::before {
            content:''; position:fixed; inset:-20%; z-index:-1; pointer-events:none;
            background:
                radial-gradient(42% 36% at 18% 8%, hsl(197 85% 26% / .5), transparent 70%),
                radial-gradient(46% 40% at 85% 92%, hsl(232 55% 30% / .45), transparent 70%);
        }

        @keyframes fade-rise {
            from { opacity:0; transform:translateY(18px); }
            to   { opacity:1; transform:translateY(0); }
        }
        .rise   { animation: fade-rise .7s ease-out both; }
        .rise-2 { animation: fade-rise .7s ease-out .15s both; }
        .rise-3 { animation: fade-rise .7s ease-out .3s both; }

        .eyebrow {
            text-transform:uppercase; letter-spacing:4px; font-size:.66rem;
            font-weight:500; color:var(--dim); text-align:center; margin-bottom:10px;
        }
        h1.title {
            font-family:var(--serif); font-weight:400; letter-spacing:-.02em;
            font-size:clamp(2.6rem,11vw,3.4rem); text-align:center; line-height:1;
        }
        .sub { font-size:.95rem; color:var(--dim); text-align:center; margin:10px 0 26px; }

        /* вкладки устройств — стеклянные таблетки */
        .tabs { display:flex; gap:8px; overflow-x:auto; padding-bottom:14px; margin-bottom:14px; -webkit-overflow-scrolling:touch; }
        .tab {
            white-space:nowrap; flex:none;
            font-family:'Inter', sans-serif; font-weight:500; font-size:.86rem;
            padding:10px 20px; border:none; border-radius:999px;
            background:var(--glass); color:var(--dim);
            box-shadow: inset 0 1px 1px rgba(255,255,255,.1), inset 0 0 0 1px var(--line-soft);
            cursor:pointer; transition:.25s;
        }
        .tab.active { background:var(--fg); color:hsl(201 100% 10%); box-shadow:none; }

        .panel { display:none; }
        .panel.active { display:block; animation:fade-rise .35s ease-out; }

        /* шаги — стеклянные карточки */
        .step {
            display:flex; gap:14px; align-items:flex-start;
            background:var(--glass); border:1px solid var(--line-soft);
            border-radius:20px; padding:16px 18px; margin-bottom:10px;
        }
        .num {
            flex:none; width:38px; height:38px; border-radius:50%;
            border:1px solid var(--line); background:var(--glass);
            display:flex; align-items:center; justify-content:center;
            font-family:var(--serif); font-size:1.15rem; color:var(--fg);
        }
        .step p { font-size:.94rem; color:var(--dim); padding-top:7px; }
        .step b { font-weight:500; color:var(--fg); }

        /* кнопка скачивания Happ — «жидкое стекло» */
        .dl-btn {
            display:block; text-align:center; margin:0 0 14px;
            font-family:'Inter', sans-serif; font-weight:500; font-size:.95rem;
            padding:14px 16px; border-radius:999px; text-decoration:none;
            color:var(--fg);
            background:rgba(255,255,255,.01);
            backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
            box-shadow: inset 0 1px 1px rgba(255,255,255,.1);
            position:relative; overflow:hidden;
        }
        .dl-btn::before {
            content:''; position:absolute; inset:0; border-radius:inherit; padding:1.4px;
            background:linear-gradient(180deg,
                rgba(255,255,255,.45) 0%, rgba(255,255,255,.15) 20%,
                rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
                rgba(255,255,255,.15) 80%, rgba(255,255,255,.45) 100%);
            -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite:xor; mask-composite:exclude;
            pointer-events:none;
        }
        .dl-btn:active { opacity:.85; }

        .note { font-size:.85rem; color:var(--dim); text-align:center; margin-top:22px; }
    </style>
</head>
<body>
    <div class="eyebrow rise">Подключение · Happ</div>
    <h1 class="title rise">IKK VPN</h1>
    <div class="sub rise-2">Выберите своё устройство</div>

    <div class="tabs rise-2">
        <button class="tab active" data-t="ios">iOS</button>
        <button class="tab" data-t="android">Android</button>
        <button class="tab" data-t="windows">Windows</button>
        <button class="tab" data-t="macos">macOS</button>
        <button class="tab" data-t="tv">Android TV</button>
    </div>

    <div id="panels" class="rise-3"></div>

    <div class="note">Нет ссылки-подписки? Купите её в боте — раздел «⭐ Купить подписку».</div>

    <script>
        const install = {
            ios:     'Установите приложение <b>Happ</b> из <b>App Store</b>.',
            android: 'Установите приложение <b>Happ</b> из <b>Google Play</b>.',
            windows: 'Скачайте и установите <b>Happ для Windows</b>.',
            macos:   'Установите <b>Happ</b> из <b>App Store</b> (Mac).',
            tv:      'Установите <b>Happ</b> из <b>Google Play</b> на телевизоре.',
        };
        const add = {
            ios:     'Откройте Happ → «<b>+</b>» → «<b>Добавить из буфера обмена</b>».',
            android: 'Откройте Happ → «<b>+</b>» → «<b>Добавить из буфера обмена</b>».',
            windows: 'В Happ нажмите «<b>Добавить</b>» и вставьте ссылку.',
            macos:   'Откройте Happ → «<b>+</b>» → «<b>Добавить из буфера обмена</b>».',
            tv:      'В Happ добавьте подписку по ссылке (или войдите через QR/код).',
        };
        // официальные ссылки на скачивание Happ
        const dl = {
            ios:     'https://apps.apple.com/us/app/happ-proxy-utility/id6504287215',
            android: 'https://play.google.com/store/apps/details?id=com.happproxy',
            windows: 'https://github.com/Happ-proxy/happ-desktop/releases',
            macos:   'https://github.com/Happ-proxy/happ-desktop/releases',
            tv:      'https://play.google.com/store/apps/details?id=com.happproxy',
        };
        const keys = ['ios','android','windows','macos','tv'];
        const panels = document.getElementById('panels');
        keys.forEach((k, i) => {
            const div = document.createElement('div');
            div.className = 'panel' + (i === 0 ? ' active' : '');
            div.dataset.p = k;
            div.innerHTML = `
                <a class="dl-btn" href="${dl[k]}" target="_blank" rel="noopener">⬇ Скачать Happ</a>
                <div class="step"><div class="num">1</div><p>${install[k]}</p></div>
                <div class="step"><div class="num">2</div><p>Купите подписку в боте и <b>скопируйте</b> свою ссылку-подписку.</p></div>
                <div class="step"><div class="num">3</div><p>${add[k]}</p></div>
                <div class="step"><div class="num">4</div><p>Выберите сервер и нажмите «<b>Подключить</b>». Готово! 🎉</p></div>`;
            panels.appendChild(div);
        });

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.querySelector(`.panel[data-p="${tab.dataset.t}"]`).classList.add('active');
            });
        });

        // ссылки на магазины открываем во внешнем браузере (корректно в Telegram-webview)
        document.querySelectorAll('.dl-btn').forEach(b => {
            b.addEventListener('click', (e) => {
                if (window.Telegram && Telegram.WebApp && Telegram.WebApp.openLink) {
                    e.preventDefault();
                    Telegram.WebApp.openLink(b.href);
                }
            });
        });

        if (window.Telegram && Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
            // цвета webview под тему сайта
            if (Telegram.WebApp.setHeaderColor) Telegram.WebApp.setHeaderColor('#002b42');
            if (Telegram.WebApp.setBackgroundColor) Telegram.WebApp.setBackgroundColor('#002b42');
        }
    </script>
</body>
</html>
