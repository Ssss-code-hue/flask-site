<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IKK — приватный VPN{% endblock %}</title>

    <!-- Шрифты: Caveat (рукописные заголовки) + EB Garamond (текст) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=5">

    <!-- если JS выключен — показываем заголовки сразу -->
    <noscript><style>.hand { opacity: 1 !important; clip-path: none !important; }</style></noscript>
</head>
<body class="{% block body_class %}{% endblock %}">

    <!-- Фоновые слои -->
    <div class="wave-cover" aria-hidden="true"></div>
    <div id="bg"></div>
    <div class="spotlight"></div>
    <div class="vintage-mark vm-tl" aria-hidden="true"></div>
    <div class="vintage-mark vm-br" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <div class="progress"></div>

    <!-- ШАПКА -->
    <header class="navbar">
        <nav class="nav-inner container">
            <a href="{{ url_for('home') }}" class="logo">IKK</a>
            <ul class="nav-links">
                <li><a href="{{ url_for('home') }}">Главная</a></li>
                <li><a href="{{ url_for('advantages') }}">Преимущества</a></li>
                <li><a href="{{ url_for('tariffs') }}">Тарифы</a></li>
                <li><a href="{{ url_for('offer') }}">Оферта</a></li>
                <li><a href="{{ url_for('bot') }}">Бот</a></li>
                <li><a href="https://t.me/IKKvpndev" target="_blank" rel="noopener" class="btn-nav">Связаться</a></li>
            </ul>
            <button class="burger" aria-label="Открыть меню"><span></span><span></span><span></span></button>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- ПОДВАЛ -->
    <footer class="footer">
        <p>© MMXXVI · IKK VPN · приватность прежде всего ·
           <a href="{{ url_for('offer') }}">Оферта</a> · связь:
           <a href="https://t.me/IKKvpndev" target="_blank" rel="noopener">@IKKvpndev</a></p>
    </footer>

    <!-- Three.js (3D-пыль на фоне) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}?v=4"></script>
</body>
</html>
