services:
  web:
    build: .
    container_name: ikk-vpn
    ports:
      # Внешний порт задаётся в .env (WEB_PORT): на сервере 80, локально 8000
      - "${WEB_PORT:-8000}:5000"
    environment:
      # Значения берутся из файла .env рядом с docker-compose.yml
      # (он в .gitignore, поэтому секреты не попадают в GitHub)
      - SECRET_KEY=${SECRET_KEY:-change-me-to-a-random-secret}
      - PORT=5000
      - DB_PATH=/app/data/ikk_bot.db
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      # Resend (HTTP-API почты) — приоритетнее SMTP, если ключ задан
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-}
      # Панель Marzban — выдача VPN-ключей из личного кабинета
      - PANEL_URL=${PANEL_URL:-}
      - PANEL_USERNAME=${PANEL_USERNAME:-}
      - PANEL_PASSWORD=${PANEL_PASSWORD:-}
      - WEB_TRIAL_DAYS=${WEB_TRIAL_DAYS:-5}
      # Lolz Merchant (lzt.market) — оплата СБП/картой на сайте
      - LOLZ_TOKEN=${LOLZ_TOKEN:-}
      - LOLZ_MERCHANT_ID=${LOLZ_MERCHANT_ID:-}
      - LOLZ_MERCHANT_SECRET=${LOLZ_MERCHANT_SECRET:-}
      # Platega (platega.io) — касса СБП/картой; активна при заданных ключах
      - PLATEGA_MERCHANT_ID=${PLATEGA_MERCHANT_ID:-}
      - PLATEGA_SECRET=${PLATEGA_SECRET:-}
      - PAY_PROVIDER=${PAY_PROVIDER:-}
      # Hysteria2 — рабочий в РФ ключ; для генерации ссылок в кабинете
      - HY_HOST=${HY_HOST:-}
      - HY_PORT=${HY_PORT:-443}
      - HY_OBFS_PASSWORD=${HY_OBFS_PASSWORD:-}
      - HY_SNI=${HY_SNI:-}
      # Пароль админ-панели (/admin)
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SITE_URL=${SITE_URL:-https://ikkvpn.com}
    volumes:
      # База лежит в папке data рядом с проектом — не стирается при обновлениях
      - ./data:/app/data
    restart: unless-stopped
